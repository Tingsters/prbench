name: Verify public dataset
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Pinned registry dataset
        default: real-cases@1.0.0
        required: true
permissions:
  contents: read
jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Download and verify without authentication or models
        env:
          PRBENCH_DATASET: ${{ inputs.dataset }}
        run: bun run prbench datasets fetch "$PRBENCH_DATASET" --out cases-local
        shell: bash
      - run: bun run prbench validate cases-local
      - run: bun run prbench preflight --cases cases-local
